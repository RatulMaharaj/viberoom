[project]
name = "viberoom"
version = "0.1.0"
description = "Agent-driven RAW photo manager and non-destructive editor — Lightroom-style library and develop tools, controlled by AI agents via MCP and REST"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "exifread>=3.5.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "rawpy>=0.27.0",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
viberoom = "viberoom:main"
viberoom-mcp = "viberoom.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=9.1.1",
]
