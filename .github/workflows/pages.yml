name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# A push to main is the whole release mechanism: build the static site, publish
# it, and the service worker prompts open tabs to reload. No installers.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm --prefix frontend ci

      # Pages serves the site from /<repo>/, so every URL the build emits — and
      # the service worker's scope — has to be prefixed with it.
      - run: npm --prefix frontend run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # Pages has no SPA rewrite; its 404 page is the only hook for deep links
      # like /edit/:id, so it gets a copy of the shell.
      - run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
