[package]
name = "viberoom-desktop"
version = "0.1.0"
description = "Viberoom — agent-driven RAW photo manager and editor"
edition = "2021"

[lib]
name = "viberoom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
strip = true
lto = true
