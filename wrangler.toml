# Cloudflare, static assets only.
#
# viberoom is a static site: the browser reads your photos off disk through the
# File System Access API and does the decoding and rendering itself, so there
# is no Worker code here — just files to serve.
#
# Build settings in the Cloudflare dashboard (leave "Root directory" empty, so
# everything below is relative to the repository root):
#
#   Build command      pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend build
#   Deploy command      npx wrangler deploy
#
# Cloudflare treats a repository containing wrangler.toml as a Workers project
# and runs `wrangler deploy`, so this is written for that rather than for the
# older Pages layout — `pages_build_output_dir` is a Pages key and Workers does
# not recognise it.

name = "viberoom"
compatibility_date = "2026-08-04"

[assets]
directory = "./frontend/dist"
# Client-side routes like /edit/<id> are not files. Serving the shell for them
# is what makes a deep link or a reload work.
not_found_handling = "single-page-application"

# SPA routing is `not_found_handling` above, not a _redirects rule. Shipping
# both is an error, not merely redundant: Cloudflare serves index.html for the
# unmatched path, then the catch-all rule matches that too, and it rejects the
# deploy with "Infinite loop detected". A host that has no equivalent setting —
# Netlify, say — wants `/*  /index.html  200` in frontend/public/_redirects.
#
# Note what SPA routing means for the app: a request to /api/v1/... comes back
# as a cheerful 200 of HTML rather than a 404, which is why the app checks for
# JSON before believing it has a backend. Do not "simplify" that check.
#
# Cache headers do live beside the app, in frontend/public/_headers, so they
# travel with it. sw.js and index.html must never be cached, since they decide
# which version of everything else you get; the hashed assets and the 1.4 MB
# LibRaw WebAssembly binary cache for a year, because their names change when
# their contents do.

# Matches what Cloudflare has on the deployed Worker, so the file and the
# dashboard do not drift.
#
# There is no Worker code here — [assets] and nothing else — so this records
# requests for the files, not anything the app does. Everything interesting
# happens in the browser, where Cloudflare cannot see it. Sampling is 1 (keep
# everything), which is right at this traffic and worth lowering if that
# changes.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

