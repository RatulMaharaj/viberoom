# Cloudflare Pages.
#
# viberoom is a static site: the browser reads your photos off disk through the
# File System Access API and does the decoding and rendering itself, so there
# is no backend to deploy and nothing here to configure beyond where the built
# files land.
#
# Build settings in the Pages dashboard:
#   Root directory   frontend
#   Build command    npm ci && npm run build
#   Output directory dist
#
# The base path stays "/" (Vite's default), which is what a Pages domain wants.
# Only a subpath deploy — GitHub Pages, say — needs VITE_BASE set, and the
# service worker and manifest follow it automatically.

name = "viberoom"
compatibility_date = "2026-08-04"
pages_build_output_dir = "frontend/dist"

# Routing and cache headers are NOT here on purpose: they live in
# frontend/public/_redirects and frontend/public/_headers, which Vite copies
# into the build. Keeping them beside the app means they travel with it to any
# host that speaks the same format, rather than being tied to this one.
#
# Two things they encode that are easy to get wrong:
#
#   * Every unmatched path serves index.html with a 200, so client-side routes
#     like /edit/<id> work. That also means a request to /api/v1/... comes back
#     as a cheerful 200 of HTML rather than a 404 — which is why the app checks
#     for JSON before believing it has a backend. Do not "simplify" that check.
#
#   * sw.js and index.html must never be cached, since they decide which
#     version of everything else you get. The hashed assets and the 1.4 MB
#     LibRaw WebAssembly binary cache for a year, because their names change
#     when their contents do.
